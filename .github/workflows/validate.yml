name: Validate container

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check dependency pins
        run: python3 scripts/update_runtime_pins.py --check
      - name: Run offline tests
        run: python3 -m unittest discover -s tests -v
      - name: Build the image with current Debian packages
        run: docker build --pull --no-cache --tag sdlc-codex-spike:local runtime
      - name: Test container startup and SSH with disposable credentials
        run: python3 tests/docker_smoke.py
