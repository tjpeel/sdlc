name: Validate source

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check public source for sensitive information
        run: python3 scripts/check_sensitive.py --staged
      - name: Check dependency pins
        run: python3 scripts/update_runtime_pins.py --check
      - name: Run offline tests
        run: python3 -m unittest discover -s tests -v
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: false
      - name: Test and build the host CLI
        run: |
          go test -count=1 ./...
          go vet ./...
          go build ./cmd/...
