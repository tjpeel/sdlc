# Environment-backed secrets support uid/gid/mode; file-backed Compose
# secrets do not. The host launcher reads only the selected profile's files.
services:
  worker:
    secrets:
      - source: signing-key
        target: signing-key
        uid: "1000"
        gid: "1000"
        mode: 0400
      - source: github-token
        target: github-token
        uid: "1000"
        gid: "1000"
        mode: 0400

secrets:
  signing-key:
    environment: SDLC_SIGNING_KEY
  github-token:
    environment: SDLC_GITHUB_TOKEN
